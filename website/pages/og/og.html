<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;background:#fbf9f4;color:#1d1b17;overflow:hidden}
.c{position:relative;width:1200px;height:630px}
.brand{position:absolute;left:84px;top:80px;display:flex;align-items:center;gap:22px}
.brand img{width:66px;height:66px;border-radius:15px}
.brand span{font:44px/1 "Instrument Serif",serif}
h1{position:absolute;left:84px;top:196px;margin:0;width:900px;font:400 90px/100px "Instrument Serif",serif;letter-spacing:-0.5px}
p{position:absolute;left:84px;top:408px;margin:0;font:400 28px/1.2 Inter,sans-serif;color:#58534a}
.pill{position:absolute;left:84px;top:496px;height:62px;padding:0 26px 0 24px;border-radius:31px;background:#12110f;color:#f4f0e8;display:flex;align-items:center;gap:16px;font:500 23px Inter,sans-serif}
.dot{width:11px;height:11px;border-radius:50%;background:#9cc8ae}
.bars{display:flex;align-items:center;gap:5px}.bars i{display:block;width:3.5px;border-radius:2px;background:#f4f0e8}
.url{position:absolute;right:84px;top:514px;font:500 25px Inter,sans-serif;color:#285a44}
</style></head><body><div class="c">
<div class="brand"><img src="../../assets/icon.png" alt=""><span>Lipik</span></div>
<h1>Speak freely. Lipik writes it down.</h1>
<p>Free, open-source voice dictation for Mac. Runs on your Mac.</p>
<div class="pill"><span class="dot"></span><span class="bars"><i style="height:12px"></i><i style="height:22px"></i><i style="height:28px"></i><i style="height:16px"></i><i style="height:26px"></i><i style="height:12px"></i></span>Hold fn and talk</div>
<div class="url">lipik.pages.dev</div>
</div></body></html>
