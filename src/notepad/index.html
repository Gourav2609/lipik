<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notepad</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #151923;
        color-scheme: dark;
        overflow: hidden;
      }
      :root[data-theme="light"],
      :root[data-theme="light"] body {
        background: #fbfcfd;
        color-scheme: light;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      try {
        if (localStorage.getItem("lipik.theme") === "light")
          document.documentElement.dataset.theme = "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/notepad/main.tsx"></script>
  </body>
</html>
