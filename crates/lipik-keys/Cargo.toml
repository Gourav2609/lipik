[package]
publish = false
edition = "2021"
name = "lipik-keys"
version = "0.3.4"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Cross-platform global keyboard shortcuts library"
readme = "README.md"
keywords = [
    "keyboard",
    "hotkey",
    "shortcuts",
    "global",
    "cross-platform",
]
categories = [
    "api-bindings",
    "os",
]
license = "MIT"

[lib]
name = "lipik_keys"
path = "src/lib.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "diagnostic"
path = "examples/diagnostic.rs"

[[example]]
name = "mask_live_check"
path = "examples/mask_live_check.rs"

[[example]]
name = "menu_mask_test"
path = "examples/menu_mask_test.rs"

[[example]]
name = "record_hotkey"
path = "examples/record_hotkey.rs"

[[test]]
name = "macos_ipc_quiescence"
path = "tests/macos_ipc_quiescence.rs"

[[test]]
name = "synthetic_input"
path = "tests/synthetic_input.rs"

[dependencies.bitflags]
version = "2"
features = ["serde"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.thiserror]
version = "2"

[target.'cfg(target_os = "linux")'.dependencies.evdev]
version = "0.13"

[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "macos")'.dependencies.block2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
features = [
    "NSEvent",
    "NSApplication",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3"

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "0.3"
features = [
    "CGEvent",
    "CGEventTypes",
    "CGEventSource",
    "CGRemoteOperation",
]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_RemoteDesktop",
    "Win32_Graphics_Gdi",
]

[target.'cfg(target_os = "windows")'.dev-dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
]
